name: tests

on:
  pull_request:
  push:
    branches:
      - "main"
      - "beta"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Each test file boots its own Nuxt app, which keeps a runner's cores busy for
  # minutes; split across runners, the files boot side by side instead.
  shard:
    name: vitest (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # setup-node runs twice: its yarn cache probe needs Corepack first (see i18n.yml).
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Restore the yarn cache
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Vitest leaves a core free by default, for the machine it shares; a
      # runner has nothing else to do.
      - name: Run tests
        run: yarn test --shard=${{ matrix.shard }}/6 --maxWorkers=100%

  # The check a branch rule can require: one name, whatever the shard count.
  vitest:
    if: ${{ !cancelled() }}
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.shard.result }}" = success
